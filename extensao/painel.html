<!doctype html>
<meta charset="utf-8">
<title>Conclusões Projudi — Painel</title>
<link rel="stylesheet" href="projudi-tabela.css">
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 16px 24px; color: #222; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0 12px 0 0; } h2 { font-size: 15px; margin: 18px 0 6px; }
  input[type=search] { padding: 5px 8px; width: 260px; } button { padding: 5px 10px; cursor: pointer; }
  table { border-collapse: collapse; margin: 4px 0 8px; } th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: #f0f3f8; } td.n { text-align: center; min-width: 60px; } .zero { color: #999; } .alerta { color: #b00020; font-weight: 700; }
  details { margin: 3px 0 3px 12px; } summary { cursor: pointer; font-weight: 600; } summary .qtd { color: #666; font-weight: 400; }
  .aviso { color: #9a5b00; font-size: 12px; } .cls { color: #1a56a0; } .urg1 { background: #fbd5d5; color: #8a0000; } .urg2 { background: #fde9c8; color: #7a4a00; } small { color: #555; } .msg { padding: 8px; background: #fff3cd; } .erro { color: #b00020; }
  .baixar { border: 1px solid #c3cfdf; border-radius: 6px; padding: 8px 12px; } .baixar > div { margin: 4px 0; } .chip { display: inline-block; margin: 2px 8px 2px 0; padding: 1px 6px; border: 1px solid #c3cfdf; border-radius: 10px; }
  h3.sub-baixar { font-size: 14px; margin: 12px 0 4px; color: #12345f; } h3.sub-baixar .qtd { font-weight: 400; color: #666; font-size: 12px; }
  .opcoes { margin: 8px 0; padding: 6px 10px; background: #f6f8fc; border-radius: 6px; } .opcoes label.radio { display: block; margin-left: 24px; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; background: #e8eef8; margin-left: 6px; }
  @media (prefers-color-scheme: dark) { body { background: #1c1d21; color: #e6e6e6; } th { background: #2a2d36; } td, th { border-color: #444; } .cls { color: #8ab4f8; } .tag { background: #2a3550; } small { color: #aaa; } }
</style>
<header>
  <h1>Conclusões Projudi</h1>
  <button id="atualizar">Verificar agora</button>
  <select id="modo"></select>
  <select id="visao"><option value="tabela">Tabelas do Projudi</option><option value="fila">Fila única (ordem de trabalho)</option></select>
  <input type="search" id="busca" placeholder="Filtrar por processo, classificador, usuário…">
  <button id="csv">Exportar CSV</button>
  <a href="modelos.html" target="_blank" style="margin-left:6px">Modelos do Projudi</a>
  <button id="abrir">Expandir tudo</button>
  <span id="quando"></span>
</header>
<div id="conteudo"></div>
<script src="ordenar.js"></script>
<script src="render.js"></script>
<script src="sugestoes.js"></script>
<script src="painel.js"></script>

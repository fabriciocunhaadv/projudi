<!doctype html>
<meta charset="utf-8">
<title>Refazer a minuta com alguns eventos — Conclusões Projudi</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 16px 24px; max-width: 760px; color: #222; }
  h1 { font-size: 18px; margin: 0 0 4px; } .dica { color: #666; font-size: 12px; }
  #status { margin: 12px 0; font-weight: 600; } .erro { color: #b00020; }
  @media (prefers-color-scheme: dark) { body { background: #1c1d21; color: #e6e6e6; } .dica { color: #aaa; } }
</style>
<link rel="stylesheet" href="tema.css">
<h1>Refazer a minuta com alguns eventos</h1>
<p class="dica">A extensão abre o processo no Projudi e a janela “Gerar PDF”. Lá você marca as movimentações que quer e aperta o botão verde para devolver ao Studio. Pode deixar esta aba aberta.</p>
<div id="status">Preparando…</div>
<div id="seletor" hidden style="border:1px solid #888;border-radius:8px;padding:10px;max-width:560px">
  <label for="selServentia" style="display:block;font-weight:600;margin-bottom:6px">Escolha a serventia onde o processo está no Projudi:</label>
  <select id="selServentia" style="width:100%;padding:6px;margin-bottom:8px"><option value="">Carregando as serventias…</option></select>
  <button id="btnServentia" disabled style="padding:6px 12px;font-weight:600;cursor:pointer">Continuar nesta serventia</button>
</div>
<script src="tabs-retry.js"></script>
<script src="gerar-util.js"></script>
<script type="module" src="refazer.js"></script>

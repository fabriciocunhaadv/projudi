<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Pauta de audiências</title>
<style>
body{font:14px Arial,sans-serif;margin:0;background:#f3f4f6;color:#000}
.barra{background:#fff;border-bottom:1px solid #ddd;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
button{padding:6px 12px;cursor:pointer}.pri{background:#4f46e5;color:#fff;border:0;border-radius:4px}
#msg{padding:6px 16px;color:#555;font-size:13px}
.folha{background:#fff;max-width:900px;margin:14px auto;padding:34px 36px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
h2.dia{text-align:center;font-size:11pt;margin:0 0 12px;font-weight:bold;text-transform:uppercase}
table.p{width:100%;border-collapse:collapse;table-layout:fixed}
table.p td{border:1px solid #000;padding:5px 6px;vertical-align:top;text-align:left;font-size:10pt;line-height:1.3}
td.h{width:46px}td.n{width:172px}
.cel{min-height:34px;outline:none;white-space:pre-wrap}.cel:focus{background:#fffbe6}
.nome{font-weight:bold;text-transform:uppercase}.rot{font-weight:bold}
.dest{background:#ffff00;font-weight:bold}.alerta{color:#d00000}.peq{font-size:8pt}
.proc{display:flex;flex-direction:column;justify-content:space-between;min-height:70px}.proc .art{margin-top:18px}
.tipo{margin-top:10px}.nl{height:10px}
.sug{font-size:8pt;color:#7a4b00}.rm{float:right;font-size:11px;padding:0 4px}
@media print{.barra,#msg,.nao-imprimir{display:none!important}body{background:#fff}.folha{box-shadow:none;margin:0;padding:0;max-width:none}h2.dia{page-break-before:always}h2.dia:first-of-type{page-break-before:auto}tr{break-inside:avoid}@page{margin:14mm}}
</style></head><body>
<div class="barra"><button class="pri" id="imprimir">Imprimir / PDF</button><button class="pri" id="copiar">Copiar texto</button><button id="reler" title="Lê de novo a Mesa de Audiência do Studio (use depois de editar algo lá)">Reler a Mesa</button><span id="msg"></span></div>
<div id="saida"></div>
<script type="module" src="pauta-doc.js"></script></body></html>

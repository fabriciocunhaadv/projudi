<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conclusões Projudi — Painel Plus</title>
<style>
  body { padding: 0 !important; }
  .plus { max-width: 1280px; margin: 0 auto; padding: 20px 28px 48px; }
  .barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .barra select, .barra input { font: inherit; border: 1px solid var(--line-forte); background: var(--card); color: var(--fg); border-radius: 10px; padding: 7px 10px; }
  .cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 14px 0 18px; }
  .cartao { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px !important; box-shadow: var(--sombra); position: relative; cursor: pointer; }
  .cartao b { font-size: 30px; font-weight: 750; letter-spacing: -.02em; display: block; line-height: 1.1; color: var(--fg); }
  .cartao span { color: var(--muted); font-size: 12px; font-weight: 500; }
  .cartao i { position: absolute; right: 12px; top: 12px; width: 10px; height: 10px; border-radius: 50%; }
  .cartao.sel { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-suave); }
  .grade { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 980px) { .grade { grid-template-columns: 1fr; } }
  .bloco { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--sombra); margin-bottom: 16px; overflow: hidden; }
  .bloco > h2 { margin: 0 !important; padding: 12px 16px; background: var(--brand-suave); color: var(--brand); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bloco > h2 small { color: var(--brand) !important; font-weight: 600; }
  .bloco table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .bloco th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .bloco td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .bloco tr:last-child td { border-bottom: 0; }
  .etq { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; margin: 0 4px 2px 0; }
  .etq.ok { background: var(--ok-suave); color: var(--ok); } .etq.av { background: var(--aviso-suave); color: var(--aviso); } .etq.er { background: var(--erro-suave); color: var(--erro); } .etq.az { background: var(--brand-suave); color: var(--brand); }
  .linha { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .linha:last-child { border-bottom: 0; } .linha .nome { flex: 1 1 200px; font-weight: 650; }
  .estrela { background: none !important; border: 0 !important; box-shadow: none !important; padding: 0 4px !important; font-size: 17px; color: var(--muted); cursor: pointer; }
  .estrela.on { color: #e5a400; }
  .vazio { padding: 18px 16px; color: var(--muted); }
  .aviso-dados { background: var(--aviso-suave); color: var(--aviso); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 12px; }
  .ac button, .ac a.bt { padding: 4px 10px !important; font-size: 12px; margin: 0 4px 4px 0; }
  a.bt { display: inline-block; border: 1px solid var(--line-forte); border-radius: 10px; font-weight: 600; color: var(--fg); background: var(--card); text-decoration: none; }
</style>
<link rel="stylesheet" href="tema.css">
<body>
<div class="plus">
  <header class="topo">
    <h1>Painel Plus</h1>
    <a href="esteira.html" data-testid="plus-esteira">Esteira de minutas</a>
    <a href="painel.html" data-testid="plus-painel">Painel completo</a>
    <a href="pauta.html">Pauta de audiências</a>
    <a href="ferramentas.html">Ferramentas</a>
    <span id="quando"></span>
  </header>
  <div class="barra">
    <select id="fServentia" data-testid="plus-f-serventia" title="Filtrar por serventia"><option value="">Serventia: todas</option></select>
    <select id="fTipo" data-testid="plus-f-modo" title="Filtrar a fila pelo tipo de trabalho"><option value="">Tipo de trabalho: todos</option></select>
    <input id="fBusca" type="search" placeholder="Buscar nº do processo" data-testid="plus-busca" aria-label="Buscar processo">
    <button id="atualizar" class="primary" data-testid="plus-atualizar" title="Abre o painel completo, onde o Projudi é lido de novo">Atualizar dados do Projudi</button>
  </div>
  <div id="aviso" class="aviso-dados" hidden></div>
  <div class="cartoes" id="cartoes" data-testid="plus-cartoes"></div>
  <div class="grade">
    <div>
      <div class="bloco"><h2>Fila de minutas <small id="filaInfo"></small></h2><div id="fila" data-testid="plus-fila"></div></div>
      <div class="bloco"><h2>Por serventia <small><label>ordenar: <select id="ordem" data-testid="plus-ordem" style="padding:3px 6px"><option value="conclusos">mais conclusos</option><option value="pre">mais pré-analisadas</option><option value="nome">nome</option></select></label></small></h2><div id="serventias" data-testid="plus-serventias"></div></div>
    </div>
    <div>
      <div class="bloco"><h2>⭐ Favoritas</h2><div id="favoritas" data-testid="plus-favoritas"></div></div>
      <div class="bloco"><h2>🕘 Últimos processos abertos <small>por aqui</small></h2><div id="recentes" data-testid="plus-recentes"></div></div>
    </div>
  </div>
</div>
<script type="module" src="plus.js"></script>
</body>
</html>

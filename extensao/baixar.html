<!doctype html>
<meta charset="utf-8">
<title>Baixar arquivos do processo — Conclusões Projudi</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 16px 24px; max-width: 980px; color: #222; }
  h1 { font-size: 18px; margin: 0 0 4px; } .dica { color: #666; font-size: 12px; }
  #arvore { border: 1px solid #c3cfdf; border-radius: 6px; padding: 8px 12px; max-height: 52vh; overflow: auto; margin: 10px 0; }
  .mov { margin: 6px 0 2px; } .mov > label { font-weight: 700; color: #12345f; } ul { margin: 2px 0 4px 22px; padding: 0; list-style: none; }
  li label { cursor: pointer; } small { color: #666; } .semurl { color: #b00020; }
  .barra { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 8px 0; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; } button.principal { background: #1a56a0; color: #fff; border: 1px solid #1a56a0; border-radius: 5px; }
  button:disabled { opacity: .5; cursor: default; } progress { width: 100%; height: 14px; } #status { margin: 6px 0; font-weight: 600; }
  #andamento { list-style: none; margin: 8px 0; padding: 0; font-size: 13px; } #andamento li { padding: 1px 0; } .erro { color: #b00020; } .ok { color: #1a7a1a; }
  #log { font: 12px monospace; white-space: pre-wrap; background: #f5f5f5; border-radius: 6px; padding: 8px; max-height: 200px; overflow: auto; }
  .res a { font-weight: 700; }
  @media (prefers-color-scheme: dark) { body { background: #1c1d21; color: #e6e6e6; } #log { background: #2a2d36; } #arvore { border-color: #3d4a5e; } .mov > label { color: #cfe0f6; } .dica, small { color: #aaa; } }
</style>
<h1>Baixar arquivos do processo <span id="proc"></span></h1>
<p class="dica">Marque as movimentações ou arquivos que você quer. Os arquivos são baixados do Projudi com a sua sessão, reunidos num PDF com
<b>índice e marcadores por movimentação</b> e, se desejar, passam por OCR (só nas páginas sem texto). Tudo é processado no seu computador.</p>
<div id="arvore">Carregando…</div>
<div class="barra">
  <label><input type="checkbox" id="todos"> <b>Marcar todos</b></label>
  <span id="contagem" class="dica"></span>
</div>
<div class="barra">
  <label><input type="radio" name="modo" value="projudi" checked> <b>PDF completo do Projudi</b> (por movimentação, já pesquisável)</label>
  <label><input type="radio" name="modo" value="unico"> Um PDF único (com índice)</label>
  <label><input type="radio" name="modo" value="separados"> Um PDF para cada arquivo</label>
  <label><input type="checkbox" id="ocr" checked> Fazer OCR nas páginas sem texto</label>
</div>
<p><button id="baixar" class="principal" disabled>Baixar selecionados</button> <button id="cancelar" disabled>Cancelar</button>
   <button id="diag" title="Copia o HTML desta lista para você me enviar, se algo não aparecer certo">Copiar diagnóstico</button></p>
<div id="status"></div>
<progress id="barra" value="0" max="1" hidden></progress>
<ul id="andamento"></ul>
<div id="resultados"></div>
<div id="log"></div>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/tesseract.min.js"></script>
<script type="module" src="baixar.js"></script>
